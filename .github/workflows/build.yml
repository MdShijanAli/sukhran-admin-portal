name: Build & Push React

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Push build to build-repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.BUILD_REPO_TOKEN }}
          external_repository: MdShijanAli/shukran-admin-dist
          publish_dir: ./build
          publish_branch: main
