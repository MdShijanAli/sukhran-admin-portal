name: React CI + Deploy to admin.shukra.store

# Trigger pipeline on push to prod branch
on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build React project
      - name: Build Project
        run: npm run build # your React build folder should be 'dist/' or 'build/'

      # 5️⃣ Deploy via SFTP to admin.shukra.store
      - name: Deploy to admin.shukra.store via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps # secure FTP
          port: 21 # ya 990 depends on hosting
          local-dir: dist/
          server-dir: ./ # relative to admin.shukra.store root
          dangerous-clean-slate: true
