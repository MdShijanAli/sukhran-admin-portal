name: React CI + Deploy to admin.shukra.store

# Trigger pipeline on push to prod branch
on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build React project
      - name: Build Project
        run: npm run build # your React build folder should be 'dist/' or 'build/'

      # 5️⃣ Deploy via SFTP to admin.shukra.store
      - name: Deploy to admin.shukra.store via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }} # your server IP
          username: ${{ secrets.FTP_USERNAME }} # admin@shukran.store
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: sftp # <-- important for shared hosting
          port: 22 # default SFTP port
          local-dir: dist/ # your React build folder
          server-dir: ./ # relative to FTP root
          dangerous-clean-slate: true # wipes old files before upload
